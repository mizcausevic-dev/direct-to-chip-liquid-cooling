name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  administration: write
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the pages branch at the site root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh api "/repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            gh api --method PUT -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f source[branch]=pages \
              -f source[path]=/
          else
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f source[branch]=pages \
              -f source[path]=/
          fi
