name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish from the pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf '%s\n' '{"build_type":"legacy","source":{"branch":"pages","path":"/"}}' > payload.json
          {
            echo POST
            gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/pages" --input payload.json
            echo POST_EXIT:$?
            echo PUT
            gh api --method PUT -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/pages" --input payload.json
            echo PUT_EXIT:$?
          } > pages-api-result.txt 2>&1
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pages-api-result.txt
          git commit -m "Record Pages API result [skip ci]" || true
          git push || true
          exit 0
